<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - AnimeChart</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <!-- Animated Background -->

    <div class="bg">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- Logo -->

    <div class="logo">

        Anime<span>Chart</span>

    </div>


    <!-- Auth Container -->

    <main class="auth-container">


        <!-- Login -->

        <section
            id="loginBox"
            class="auth-box active"
        >

            <div class="auth-icon">
                🎌
            </div>


            <h1>
                Welcome Back
            </h1>


            <p class="subtitle">
                Sign in to continue to AnimeChart
            </p>


            <form id="loginForm">


                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        required
                    >

                </div>


                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        class="password-btn"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁️
                    </button>

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >

                    <span>
                        Login
                    </span>

                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>


            </form>


            <div class="switch">

                Don't have an account?

                <button
                    onclick="showRegister()"
                >
                    Create Account
                </button>

            </div>


        </section>


        <!-- Register -->

        <section
            id="registerBox"
            class="auth-box"
        >

            <div class="auth-icon">
                ✨
            </div>


            <h1>
                Create Account
            </h1>


            <p class="subtitle">
                Join the AnimeChart community
            </p>


            <form id="registerForm">


                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Email"
                        required
                    >

                </div>


                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-btn"
                        onclick="togglePassword('registerPassword', this)"
                    >
                        👁️
                    </button>

                </div>


                <div class="input-box">

                    <span>🔐</span>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >

                    <span>
                        Create Account
                    </span>

                </button>


                <p
                    id="registerMessage"
                    class="message"
                ></p>


            </form>


            <div class="switch">

                Already have an account?

                <button
                    onclick="showLogin()"
                >
                    Login
                </button>

            </div>


        </section>

    </main>


    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>
